<!DOCTYPE html>
<html lang="en">
<head>

    <title>The Ludic Oracle - A Vision of Experimental Games</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive directive -->
  
    <!-- Basic SEO -->
    <meta name="description" content="The Ludic Oracle offers game developers experimental game ideas to please the Ludic Gods. Dive into surreal visions and creative gameplay concepts.">
    <meta name="author" content="Wes Modes">
    <meta name="keywords" content="game development, experimental games, creative gameplay, Ludic Oracle, game ideas">
  
    <!-- Open Graph (Facebook & LinkedIn) -->
    <meta property="og:title" content="The Ludic Oracle - A Vision of Experimental Games">
    <meta property="og:description" content="Receive experimental game ideas from the Ludic Oracle, tailored to spark creativity and innovation in game development.">
    <meta property="og:image" content="https://wmodes.github.io/webexperiments/ludic-oracle/img/oracle.png">
    <meta property="og:image:alt" content="The Ludic Oracle - Experimental Game Ideas">
    <meta property="og:url" content="https://wmodes.github.io/webexperiments/ludic-oracle/">
    <meta property="og:type" content="website">
  
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Ludic Oracle - A Vision of Experimental Games">
    <meta name="twitter:description" content="Get inspired by the Ludic Oracle's experimental game ideas. Discover surreal concepts to fuel your game development creativity.">
    <meta name="twitter:image" content="https://wmodes.github.io/webexperiments/ludic-oracle/img/oracle.png">
    <meta name="twitter:image:alt" content="The Ludic Oracle - Experimental Game Ideas">
    <meta name="twitter:site" content="@wmodes">
    <meta name="twitter:creator" content="@wmodes">
  
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://wmodes.github.io/webexperiments/ludic-oracle/favicon.png">

    <link rel="stylesheet" type="text/css" href="css/style.css">
    <!-- load jquery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <!-- load tracery-improved (Tracery that cycles through all of a symbol's rules before repeating one),
         bundled in js/ so the Oracle stands alone -->
    <script src="js/tracery.js"></script>
    <!-- load tracery grammar -->
    <script src="js/grammar.js"></script>
    <!-- load the offerings, the answers' keywords, and the weighter that tilts the grammar by them -->
    <script src="js/offerings.js"></script>
    <script src="js/answers.js"></script>
    <script src="js/grammar-weighter.js"></script>
    <!-- load seeded random numbers, so a share link can reproduce a vision -->
    <script src="js/seeded-random.js"></script>
    <!-- load custom js -->
    <script src="js/ludic-oracle.js"></script>
  
</head>
<body>
    <main id="content">
        <!-- The trance: the temple dims and the halo glows (see #content.trancing in the stylesheet) -->
        <div id="trance-dim"></div>
        <div id="trance-glow"></div>

        <!-- Hidden until the first speech fades in, so no empty bubble flashes on load.
             Inline (not in the stylesheet) so jQuery's fadeIn restores the flex layout. -->
        <div class="bubble-wrapper" style="display: none;">
            <!-- aria-live: screen readers announce each new speech -->
            <div class="speech-bubble" aria-live="polite">
            </div>
        </div>

    </main>
</body>
</html>
